name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The stub test uses a real git repo and real pytest, but a stubbed model,
    # so it runs anywhere without Ollama.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Configure git for worktree operations
        run: |
          git config --global user.email "ci@local"
          git config --global user.name "ci"

      - name: Test
        run: pytest -q -s
