[project]
name = "apiary"
version = "0.1.0"
description = "Local multi-agent coding swarm: LangGraph orchestrator + Ollama workers, isolated by git worktrees"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-ollama>=1.1.0",
    "langchain-core>=1.5.0",
    "pydantic>=2.9",
]

[project.scripts]
swarm = "swarm.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm"]
